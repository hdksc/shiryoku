<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    http-equiv="Pragma"
    content="no-cache"
  />

  <meta
    http-equiv="Cache-Control"
    content="no-cache"
  />

  <title>
    非公式こみゃく視力検査表
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <svg
    id="svg"
    viewBox="0 0 1200 1280"
  >

    <!-- 背景 -->

    <rect
      x="20"
      y="20"
      width="1160"
      height="1250"
      rx="60"
      fill="#efefef"
    />

    <!-- タイトル -->

    <text
      x="110"
      y="110"
      class="title"
    >
      非公式こみゃく視力検査表
    </text>

    <text
      x="760"
      y="110"
      class="subtitle"
    >
      （こみゃくの向く向きで検査）
    </text>

  </svg>

  <!-- =========================
       検査UI
  ========================= -->

  <div id="examUI">

    <button id="startBtn">
      視力検査開始
    </button>

    <div id="status"></div>

    <div id="answerPad">

      <button data-dir="upleft">
        ↖
      </button>

      <button data-dir="up">
        ↑
      </button>

      <button data-dir="upright">
        ↗
      </button>

      <button data-dir="left">
        ←
      </button>

      <div class="padCenter"></div>

      <button data-dir="right">
        →
      </button>

      <button data-dir="downleft">
        ↙
      </button>

      <button data-dir="down">
        ↓
      </button>

      <button data-dir="downright">
        ↘
      </button>

    </div>

  </div>

  <!-- Google Analytics -->

  <script
    async
    src="https://www.googletagmanager.com/gtag/js?id=G-VCHEJ575KM"
  ></script>

  <script>

    window.dataLayer =
      window.dataLayer || [];

    function gtag(){
      dataLayer.push(arguments);
    }

    gtag(
      'js',
      new Date()
    );

    gtag(
      'config',
      'G-VCHEJ575KM'
    );

  </script>

  <footer id="footer">

    &copy;

    <a
      href="https://x.com/hideko"
      target="_blank"
      rel="noopener noreferrer"
    >
      @hideko
    </a>

    <br />

    ※公式の大阪・関西万博協会とは関係ありません。<br>

    ※公式キャラクターを用いた二次創作です。<br />

    <a
      href="https://hikoshiki-expo.pages.dev"
      target="_blank"
      rel="noopener noreferrer"
    >
      非公式万博ゲームシリーズはこちら
    </a>

  </footer>

  <script src="script.js"></script>
  <script src="exam.js"></script>

</body>
</html>
