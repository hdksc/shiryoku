<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Cache-Control" content="no-cache">
<title>非公式こみゃく視力検査表</title>

<style>

body{
  margin:0;
  background:#000;
  font-family:sans-serif;

  display:flex;
  flex-direction:column;
  align-items:center;

  min-height:100vh;
}

svg{
  width:100vw;
  height:auto;
  max-height:calc(100vh - 90px);
  display:block;
  margin:auto;
}

.title{
  font-size:54px;
  font-weight:bold;
}

.subtitle{
  font-size:28px;
  font-weight:bold;
}

.label{
  font-size:28px;
  font-weight:bold;
}

footer{
  color:#ccc;
  text-align:center;

  font-size:14px;
  line-height:1.7;

  padding:
    8px
    0
    18px;

  flex-shrink:0;
}

footer a{
  color:#7db7ff;
  text-decoration:none;
}
</style>
</head>

<body>

<svg
  id="svg"
  viewBox="0 0 1200 1350"
>

  <!-- 背景 -->
  <rect
    x="20"
    y="20"
    width="1160"
    height="1290"
    rx="60"
    fill="#efefef"
  />

  <!-- タイトル -->
  <text
    x="110"
    y="110"
    class="title"
  >
    非公式こみゃく視力検査表
  </text>

  <text
    x="760"
    y="110"
    class="subtitle"
  >
    （こみゃくの向く向きで検査）
  </text>

</svg>

<script>

const svg = document.getElementById("svg");

/* =========================
   SVG生成
   ========================= */

function el(name){
  return document.createElementNS(
    "http://www.w3.org/2000/svg",
    name
  );
}

/* =========================
   方向
   ========================= */

const dirs = [
  { x: 1,  y: 0  },
  { x: 1,  y:-1  },
  { x: 0,  y:-1  },
  { x:-1,  y:-1  },
  { x:-1,  y: 0  },
  { x:-1,  y: 1  },
  { x: 0,  y: 1  },
  { x: 1,  y: 1  }
];

/* =========================
   行設定
   ========================= */

const rows = [
  { label:"0.1", scale:2.6, rowHeight:150 },
  { label:"0.2", scale:1.5, rowHeight:110 },
  { label:"0.3", scale:1.0, rowHeight:85 },
  { label:"0.4", scale:0.78, rowHeight:72 },
  { label:"0.5", scale:0.62, rowHeight:62 },
  { label:"0.6", scale:0.50, rowHeight:55 },
  { label:"0.7", scale:0.42, rowHeight:50 },
  { label:"0.8", scale:0.36, rowHeight:46 },
  { label:"0.9", scale:0.31, rowHeight:42 },
  { label:"1.0", scale:0.27, rowHeight:38 },
  { label:"1.2", scale:0.23, rowHeight:34 },
  { label:"1.5", scale:0.19, rowHeight:30 },
  { label:"2.0", scale:0.15, rowHeight:26 },
  { label:"4.0", scale:0.09, rowHeight:20 }
];

/* =========================
   テーブル位置
   ========================= */

const tableLeft = 320;
const tableRight = 1120;

const cols = 5;

const colWidth =
  (tableRight - tableLeft) / (cols - 1);

let currentY = 240;

/* =========================
   全こみゃく
   ========================= */

const komyakus = [];

/* =========================
   こみゃく生成
   ========================= */

function createKomyaku(
  x,
  y,
  scale,
  dirX,
  dirY
){

  const group = el("g");

  const exp = {
    dirX,
    dirY,
    blink: 0,
    eyeX: 0,
    eyeY: 0,
    jump: 0
  };

  /*
    基本値
  */

  const baseX = 30;
  const baseY = 30;

  const outer = 20;
  const middle = outer / 2;
  const pupil = outer / 5;

  /*
    黒
  */

  const outerCircle = el("circle");

  outerCircle.setAttribute(
    "cx",
    baseX
  );

  outerCircle.setAttribute(
    "cy",
    baseY
  );

  outerCircle.setAttribute(
    "r",
    outer
  );

  outerCircle.setAttribute(
    "fill",
    "#000"
  );

  group.appendChild(outerCircle);

  /*
    白目グループ
  */

  const eyeGroup = el("g");

  /*
    白目
  */

  const white = el("circle");

  white.setAttribute("cx", 0);
  white.setAttribute("cy", 0);

  white.setAttribute(
    "r",
    middle
  );

  white.setAttribute(
    "fill",
    "#fff"
  );

  eyeGroup.appendChild(white);

  /*
    青瞳
  */

  const blue = el("circle");

  blue.setAttribute(
    "r",
    pupil
  );

  blue.setAttribute(
    "fill",
    "#3d6fb6"
  );

  eyeGroup.appendChild(blue);

  group.appendChild(eyeGroup);

  svg.appendChild(group);

  const k = {
    group,
    eyeGroup,
    blue,
    exp,
    scale,
    x,
    y
  };

  komyakus.push(k);

  redraw(k);

  return k;
}

/* =========================
   再描画
   ========================= */

function redraw(k){

  const exp = k.exp;

  /*
    中心補正
  */

  const offset =
    30 * k.scale;

  /*
    本体
  */

  k.group.setAttribute(
    "transform",
    `
    translate(
      ${k.x - offset},
      ${k.y - offset - exp.jump}
    )
    scale(${k.scale})
    `
  );

  /*
    ユーザー提供ロジック
  */

  const outer = 20;

  const eyeOffsetX =
    exp.dirX * outer / 3;

  const eyeOffsetY =
    exp.dirY * outer / 3;

  /*
    白目
  */

  k.eyeGroup.setAttribute(
    "transform",
    `
    translate(
      ${30 + eyeOffsetX},
      ${30 + eyeOffsetY}
    )
    scale(
      1,
      ${1 - exp.blink}
    )
    `
  );

  /*
    青瞳
  */

  const middle = outer / 2;

  k.blue.setAttribute(
    "cx",
    exp.dirX * middle / 3 + exp.eyeX
  );

  k.blue.setAttribute(
    "cy",
    exp.dirY * middle / 3 + exp.eyeY
  );
}

/* =========================
   瞬き
   ========================= */

function blink(k){

  let t = 0;

  const id = setInterval(()=>{

    k.exp.blink =
      Math.sin(Math.PI * t);

    redraw(k);

    t += 0.2;

    if(t >= 1){

      k.exp.blink = 0;

      redraw(k);

      clearInterval(id);
    }

  }, 40);
}

/* =========================
   きょろきょろ
   ========================= */

function lookAround(k){

  const seq = [
    [-2,0],
    [2,0],
    [0,2],
    [0,-2],
    [0,0]
  ];

  let i = 0;

  const id = setInterval(()=>{

    k.exp.eyeX = seq[i][0];
    k.exp.eyeY = seq[i][1];

    redraw(k);

    i++;

    if(i >= seq.length){

      clearInterval(id);
    }

  }, 500);
}

/* =========================
   ジャンプ
   ========================= */

function hop(k){

  let t = 0;

  const id = setInterval(()=>{

    k.exp.jump =
      Math.sin(Math.PI * t) * 10;

    redraw(k);

    t += 0.15;

    if(t >= 1){

      k.exp.jump = 0;

      redraw(k);

      clearInterval(id);
    }

  }, 30);
}

/* =========================
   アイドル開始
   ========================= */

function startIdle(k){

  const initialDelay =
    500 + Math.random() * 3000;

  setTimeout(()=>{

    setInterval(()=>{

      const r = Math.random();

      if(r < 0.05){

        blink(k);

      }else if(r < 0.25){

        lookAround(k);

      }else if(r < 0.45){

        hop(k);
      }

    }, 2000 + Math.random() * 4000);

  }, initialDelay);
}

/* =========================
   描画
   ========================= */

rows.forEach((row)=>{

  const centerY = currentY;

  /*
    ラベル
  */

  const label = el("text");

  label.setAttribute("x", 60);

  label.setAttribute(
    "y",
    centerY + 12
  );

  label.setAttribute(
    "class",
    "label"
  );

  label.textContent =
    row.label;

  svg.appendChild(label);

  /*
    各列
  */

  for(let col=0; col<cols; col++){

    const centerX =
      tableLeft + col * colWidth;

    const dir =
      dirs[
        Math.floor(
          Math.random() * dirs.length
        )
      ];

    const k = createKomyaku(
      centerX,
      centerY,
      row.scale,
      dir.x,
      dir.y
    );

    startIdle(k);
  }

  currentY += row.rowHeight;
});

</script>
